<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DHMIS mockups – Clinician &amp; Org owner</title><link rel="icon" href="data:,">
<style>
:root{--bg:#f4f6f5;--sf:#fff;--sf2:#eef2f0;--bd:#dbe3df;--tx:#111a16;--mu:#54655d;--ac:#0b8a55;--ac2:#d3f1e2;--on:#fff;--wn:#8a4b00;--wn2:#fdebc8;--er:#b42318;--er2:#fde3e0;--in:#1d4ed8;--in2:#dfe8fd}
:root[data-theme=dark]{--bg:#0d1512;--sf:#131d19;--sf2:#1a2621;--bd:#25342d;--tx:#e8f0ec;--mu:#95a89e;--ac:#34d399;--ac2:#12382a;--on:#04160e;--wn:#fbbf24;--wn2:#3a2b0c;--er:#f87171;--er2:#3d1b19;--in:#93b4ff;--in2:#1b2a52}
*{box-sizing:border-box}html,body{margin:0}body{background:#e6ebe8;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);padding-top:env(safe-area-inset-top,0)}
:root[data-theme=dark] body{background:#070c0a}
button,select,input,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:9;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:#0f1a15;color:#e8f0ec}
.bar b{margin-right:8px}.bar button{background:#22322b;border:0;border-radius:6px;padding:6px 10px;color:#e8f0ec;cursor:pointer}
.bar button[aria-pressed=true]{background:#34d399;color:#04160e;font-weight:600}.bar .sp{flex:1}
.app{background:var(--bg);color:var(--tx);min-height:80vh;overflow:hidden}
.sand{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 16px;background:var(--wn2);color:var(--wn);font-size:12px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.top .q{flex:1;min-width:160px;max-width:420px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
.top .sp{flex:1}.ib{background:none;border:0;cursor:pointer;padding:6px;border-radius:6px}
.usr{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;text-align:left;padding:4px 6px;border-radius:8px}
.usr:hover,.ib:hover{background:var(--sf2)}
.av{width:28px;height:28px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-size:11px;font-weight:700}
.menuw{position:relative}.menu{position:absolute;right:0;top:100%;margin-top:4px;min-width:220px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:4px;z-index:5;box-shadow:0 8px 24px #0003}
.menu a,.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--sf2)}.menu hr{border:0;border-top:1px solid var(--bd);margin:4px 0}.menu small{display:block;color:var(--mu);padding:0 10px 6px}
.lay{display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--bd);padding:12px 8px;background:var(--sf)}
.side h6{margin:14px 10px 4px;font-size:12px;color:var(--mu);font-weight:600}.side a{display:block;padding:7px 10px;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}
.side a.on{background:var(--ac2);color:var(--ac);font-weight:600}.side a.sub{margin-left:14px;border-left:2px solid var(--bd);border-radius:0 6px 6px 0;color:var(--mu)}
.side a.sub.on{border-left-color:var(--ac)}
main{padding:20px 24px 40px;min-width:0}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0}.mu{color:var(--mu)}.sm{font-size:12px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd);font-weight:500}.btn.w{background:#e9a935;color:#1c1300}.btn[disabled]{opacity:.5;cursor:not-allowed}.btn.sm{padding:4px 9px;font-size:12px}
.in,select.in,textarea.in{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;min-width:0}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12px;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;text-align:left;cursor:pointer;position:relative}
.k:hover{border-color:var(--ac)}.k .l{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}.k .v{font-size:26px;font-weight:600;margin:6px 0 2px}.k .d{font-size:12px;color:var(--mu)}.k .go{font-size:12px;color:var(--ac);font-weight:600;margin-top:6px;display:block}
.i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--mu);font-size:10px;cursor:help}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;min-width:0}
.card>.h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap}.card>.b{padding:14px}
.link{color:var(--ac);font-weight:600;font-size:13px;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.emp{text-align:center;padding:22px 10px;color:var(--mu)}.emp b{display:block;color:var(--tx);margin-bottom:2px}
.ai{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--bd)}.ai:last-child{border:0}
.tag{display:inline-flex;gap:4px;align-items:center;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.t-w{background:var(--wn2);color:var(--wn)}.t-e{background:var(--er2);color:var(--er)}.t-o{background:var(--ac2);color:var(--ac)}.t-i{background:var(--in2);color:var(--in)}.t-n{background:var(--sf2);color:var(--mu)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}th{font-size:12px;color:var(--mu);font-weight:600;background:var(--sf2);white-space:nowrap}
.sc{overflow-x:auto}.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.fl label{display:grid;gap:3px;font-size:12px;color:var(--mu)}
.pg{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:10px 12px;font-size:13px}.pg .c{display:flex;gap:4px;align-items:center}
.pg button{min-width:32px;border:1px solid var(--bd);background:var(--sf);border-radius:6px;padding:4px 8px;cursor:pointer}.pg button[aria-current]{background:var(--ac);color:var(--on);border-color:var(--ac)}.pg button[disabled]{opacity:.45;cursor:not-allowed}
.al{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}.al.e{background:var(--er2);color:var(--er)}.al.o{background:var(--ac2);color:var(--ac)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;margin-bottom:12px}.frm label{display:grid;gap:3px;font-size:12px;color:var(--mu)}
.chips span{display:inline-block;background:var(--sf2);border:1px solid var(--bd);border-radius:99px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0}
.tpl{display:grid;grid-template-columns:230px 1fr;gap:12px}.tpl .li button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:10px 12px;cursor:pointer}.tpl .li button.on{background:var(--ac2);color:var(--ac);font-weight:600}
.pv{background:var(--sf2);border-radius:8px;padding:12px;white-space:pre-line}
.fr{max-width:390px;margin:16px auto;border:8px solid #1b2a24;border-radius:26px;overflow:hidden}.fr .lay{grid-template-columns:1fr}.fr .side,.fr .sidehide{display:none}.fr main{padding:14px 14px 28px}.fr .g2,.fr .tpl{grid-template-columns:1fr}.fr .kp{grid-template-columns:1fr 1fr}
.mnav{display:none;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--bd)}.fr .mnav{display:flex}.mnav a{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);color:var(--tx);text-decoration:none}.mnav a.on{background:var(--ac2);color:var(--ac);border-color:var(--ac);font-weight:600}
.pt{max-width:560px;margin:0 auto;padding:16px 16px 96px}.pt .cg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.foot{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
.foot a{display:grid;justify-items:center;gap:1px;padding:10px 4px;font-size:12px;color:var(--mu);text-decoration:none}.foot a.on{color:var(--ac);font-weight:700}.foot a.call{color:var(--on);background:var(--ac);font-weight:700}
.act{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.note{background:var(--in2);color:var(--in);border-radius:8px;padding:8px 12px;font-size:12px;margin:0 0 12px}
@media(max-width:760px){.lay{grid-template-columns:1fr}.side{display:none}.mnav{display:flex}.g2,.tpl{grid-template-columns:1fr}main{padding:14px}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pnav{display:flex;gap:2px;margin-left:12px}.pnav a{padding:8px 12px;border-radius:6px;color:var(--mu);text-decoration:none;font-weight:500}.pnav a.on{background:var(--ac2);color:var(--ac);font-weight:700}
.foot{display:none}.ptop .call{white-space:nowrap;text-decoration:none}
@media(max-width:720px){.pnav{display:none}.foot{display:grid}.ptop .call{display:none}}
.bar2{height:6px;background:var(--sf2);border-radius:4px;min-width:70px}.bar2 i{display:block;height:100%;background:var(--ac);border-radius:4px}
.side{display:flex;flex-direction:column}.side .need{margin-top:auto;padding:12px 10px;font-size:12px;color:var(--mu)}.side .need a{display:inline;padding:0;color:var(--ac);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--sf);padding:6px 12px;cursor:pointer;font-size:13px}.seg button[aria-pressed=true]{background:var(--ac);color:var(--on);font-weight:600}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--bd)}.tl li{position:relative;padding:0 0 14px 14px}.tl li:before{content:"";position:absolute;left:-23px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--ac)}.tl li.r:before{background:var(--mu)}
</style></head><body>
<div class="bar" role="toolbar" aria-label="Mockup screens"><b>DHMIS v1.3</b><span id="tabs"></span><span class="sp"></span><button id="th" aria-pressed="false">Dark theme</button></div>
<div id="root"></div>
<script>
const S={psub:'',jf:'all',jqf:'all',js:25,jp:1,incf:'open',incOpen:'INC-1042',hs:10,hp:1,supf:'all',supst:'all',ss:25,sp:1,os:10,op:1,pmenu:false,help:false,ts:10,tp:1,v:'dash',sub:'staff',dark:matchMedia('(prefers-color-scheme:dark)').matches,menu:false,range:'Today',tpl:0,noExp:false,ap:1,as:25,cp:1,cs:10,dup:true};
const V=[['dash','Clinician'],['org','Org owner']];
const SUB=[['pol','Practice policy'],['int','Integrations'],['staff','Staff & invitations'],['tpl','Message templates'],['aud','Audit trail'],['roles','Roles & access']];
const $=s=>document.querySelector(s);
const tag=(c,t)=>`<span class="tag t-${c}">${t}</span>`;
function pager(k,total,size){const p=S[k+'p'],n=Math.ceil(total/size),a=(p-1)*size+1,b=Math.min(total,p*size);
 const pages=[...new Set([1,p-1,p,p+1,n])].filter(x=>x>=1&&x<=n).sort((x,y)=>x-y);let h='',last=0;
 pages.forEach(x=>{if(x-last>1)h+='<span aria-hidden="true">…</span>';h+=`<button data-pg="${k}:${x}" ${x==p?'aria-current="page"':''} aria-label="Page ${x}">${x}</button>`;last=x});
 return `<nav class="pg" aria-label="Pagination"><span>Showing <b>${a}–${b}</b> of <b>${total.toLocaleString()}</b> · Page ${p} of ${n}</span><span class="c"><label class="mu sm">Rows per page <select class="in" data-size="${k}">${[10,25,50,100].map(x=>`<option ${x==size?'selected':''}>${x}</option>`).join('')}</select></label>
 <button data-pg="${k}:${p-1}" ${p<=1?'disabled':''}>Prev</button>${h}<button data-pg="${k}:${p+1}" ${p>=n?'disabled':''}>Next</button></span></nav>`}
const NAVS={org:[['Overview',[['Organization','org']]],['Locations',[['All locations'],['Staff performance']]],['Finance',[['Financials'],['Claims']]],['Admin',[['Settings','set']]]]};
function shell(body,m){const P={org:['Bright Smiles Dental Group · All locations ▾','MO','Maya Okafor','owner','Search staff or locations…'],plat:['DHMIS Platform · Production ▾','PN','Priya Nair','platform admin','Search tenants…']}[S.v]||['DHMIS Demo Clinic · Vancouver ▾','AC','Dr. Alex Chen','admin','Search patients…'];const HM=S.v=='plat'?'':`<div class="menuw"><button class="ib" data-help aria-haspopup="true" aria-expanded="${S.help}">? Help</button>${S.help?`<div class="menu" role="menu" style="width:300px"><small style="padding-top:8px"><b>Help &amp; support</b><br><span class="tag t-o">✓ All systems operational</span></small><a href="#" role="menuitem">Contact DHMIS support</a><a href="#" role="menuitem">Email support</a><a href="#" role="menuitem">Ask my clinic administrator</a><a href="#" role="menuitem">Guides &amp; how-tos</a><hr><small>Please don’t include patient names or health details in a message. We’ll attach the page and time automatically.</small></div>`:''}</div>`;
 const menu=S.menu?`<div class="menu" role="menu"><small>${P[2]} · ${P[3]}</small><a href="#" role="menuitem" data-go="prof">My profile</a><a href="#" role="menuitem" data-go="prof">Change password</a><a href="#" role="menuitem" data-go="prof">Security &amp; MFA</a>${S.v=='plat'?'':'<hr><small>Help &amp; support</small><a href="#" role="menuitem">Contact support</a><a href="#" role="menuitem">Guides &amp; how-tos</a>'}<hr><button role="menuitem">Sign out</button></div>`:'';
 const nav=NAVS[S.v]||[['Overview',[['Dashboard','dash']]],['Clinical',[['Schedule'],['Patients']]],['Practice',[['Billing','bill'],['Claims','bill']]],['Admin',[['Settings','set']]]];
 const side=nav.map(([h,it])=>`<h6>${h}</h6>`+it.map(([n,v])=>{if(typeof v=='string'&&v.startsWith('p:')){const ps=v.slice(2);return `<a class="${S.psub==ps?'on':''}" data-psub="${ps}">${n}</a>`}
 return `<a class="${v&&(S.v==v||S.v=='mob'&&v=='dash')?'on':''}" ${v?`data-go="${v}"`:''}>${n}</a>`+(n=='Settings'&&S.v=='set'?SUB.map(([k,l])=>`<a class="sub ${S.sub==k?'on':''}" data-sub="${k}">${l}</a>`).join(''):'')}).join('')).join('');
 const mn=['Dashboard:dash','Patients:x','Schedule:x','Billing:bill','Claims:bill','Settings:set'].map(s=>{const[a,b]=s.split(':');return `<a data-go="${b}" class="${(S.v==b||S.v=='mob'&&b=='dash')&&a!='Claims'?'on':''}">${a}</a>`}).join('');
 return `<div class="app"><div class="sand"><span><b>Development sandbox</b> · Synthetic records · no live payments, claims, or signatures</span><span>Refresh · Sign out</span></div>
 <header class="top"><b>DHMIS</b><span class="mu">${P[0]}</span><input class="q" placeholder="${P[4]}" aria-label="Search"><span class="sp"></span>${HM}<button class="ib" aria-label="Notifications, 2 unread">🔔 <b>2</b></button>
 <div class="menuw"><button class="usr" data-menu aria-haspopup="menu" aria-expanded="${S.menu}"><span class="av">${P[1]}</span><span><b>${P[2]}</b><br><span class="mu sm">${P[3]} ▾</span></span></button>${menu}</div></header>
 <nav class="mnav" aria-label="Sections">${mn}</nav><div class="lay"><aside class="side">${side}${S.v=='plat'?'':'<div class="need">Need a hand? <a href="#">Contact support</a></div>'}</aside><main>${body}</main></div></div>`}
function dash(){const R=['Today','Yesterday','This week','This month','Quarter','Year to date','Custom range'],rg=R.includes(S.range)?S.range:'Today';
 const K=[['Today’s visits','0','▬ same as yesterday','Scheduled appointments in the selected range, excluding cancelled.'],['Patients','3','▲ 1 vs last week','Active patients in this clinic.'],['Claims pending','0','▬ same as last week','Claims submitted and awaiting a payer response.'],['Outstanding balance','$120.00','▲ $60.00 vs last week','Patient receivables not yet paid, across open invoices and payment plans.']];
 return `<div class="hd"><div><h1>Good morning, Dr. Alex Chen</h1><div class="mu">Sunday, September 27</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="sm mu" style="display:grid">Date range<select class="in" data-range>${R.map(r=>`<option ${r==rg?'selected':''}>${r}</option>`).join('')}</select></label><button class="btn" style="align-self:end">+ New appointment</button></div></div>
 <div class="meta"><span>Range: <b>${rg}</b> · compared with previous period</span><span>Sep 27, 2026 · America/Vancouver (PDT)</span><span>Updated 8:02 AM</span></div>
 <div class="kp">${K.map(k=>`<button class="k"><span class="l">${k[0]}<span class="i" title="${k[3]}" aria-label="Definition: ${k[3]}">i</span></span><div class="v">${k[1]}</div><div class="d">${k[2]}</div><span class="go">View list</span></button>`).join('')}</div>
 <div class="g2"><section class="card"><div class="h"><h2>Action centre</h2><span class="sm mu">3 open</span></div>
 <div class="ai"><div><b>Installment due in 3 days</b><div class="mu sm">Sample Patient A · $60.00 due Sep 30 · Plan balance $120.00</div></div><div>${tag('w','Due soon')}</div><div>${tag('i','Open')}</div><div><button class="btn sm">Open plan</button> <button class="btn s sm">Send reminder</button></div></div>
 <div class="ai"><div><b>Installment overdue 2 days</b><div class="mu sm">Sample Patient B · $45.00 due Sep 25 · Plan balance $135.00</div></div><div>${tag('e','⚠ Overdue')}</div><div>${tag('t','In progress').replace('t-t','t-i')}</div><div><button class="btn sm">Open plan</button> <button class="btn s sm">Contact patient</button></div></div>
 <div class="ai"><div><b>Staff invitation expired</b><div class="mu sm">Dr. Jordan Lee · sent Sep 13, expired Sep 20</div></div><div>${tag('n','Info')}</div><div>${tag('i','Open')}</div><div><button class="btn sm" data-go="set">Resend</button></div></div></section>
 <section class="card"><div class="h"><h2>Today’s schedule</h2><button class="link">View full calendar</button></div><div class="emp"><b>No appointments scheduled today</b>Nothing is booked for Sunday, Sep 27.<br><br><button class="btn s sm">Book an appointment</button></div></section></div>`}
function staff(){const st={p:['w','Pending'],a:['o','✓ Active'],x:['n','Expired'],r:['e','Revoked']};
 const rows=[['Dr. Jordan Lee','jordan.lee@demo.dhmis.test','dentist','Vancouver','p','Sep 27','Oct 4'],['Dr. Alex Chen','alex.chen@demo.dhmis.test','admin','Vancouver, Burnaby','a','Aug 2','—'],['R. Singh','r.singh@demo.dhmis.test','front desk','Burnaby','x','Sep 13','Sep 20'],['T. Ezra','t.ezra@demo.dhmis.test','hygienist','Vancouver','r','Sep 1','—']];
 return `<h1>Staff & invitations</h1><p class="mu">Invite staff to one or more locations. A person can hold different roles at different locations.</p>
 ${S.dup?`<div class="al e" role="alert"><b>Invitation not sent.</b> Dr. Jordan Lee already has a pending dentist assignment at Vancouver. Choose a different role or location.</div>`:''}
 <section class="card" style="margin-bottom:14px"><div class="b"><div class="frm"><label>Name<input class="in" value="Dr. Jordan Lee"></label><label>Email<input class="in" value="jordan.lee@demo.dhmis.test"></label><label>Role<select class="in"><option>dentist</option></select></label><label>Locations<select class="in" multiple size="2"><option selected>Vancouver</option><option>Burnaby</option></select></label><button class="btn" data-dup>Send invitation</button></div></div></section>
 <section class="card"><div class="h"><h2>Invitations & access</h2><span class="fl" style="margin:0"><select class="in" aria-label="Status filter"><option>All statuses</option><option>Pending</option><option>Active</option><option>Expired</option><option>Revoked</option></select></span></div><div class="sc"><table><thead><tr><th>Staff</th><th>Role</th><th>Locations</th><th>Status</th><th>Sent</th><th>Expires</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b><div class="mu sm">${r[1]}</div></td><td>${r[2]}</td><td>${r[3]}</td><td>${tag(...st[r[4]])}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[4]=='p'||r[4]=='x'?'<button class="btn s sm">Resend</button> ':''}${r[4]=='p'?'<button class="btn s sm">Revoke</button> ':''}${r[4]=='a'?'<button class="btn s sm">Send password reset</button>':''}</td></tr>`).join('')}</tbody></table></div></section>
 <p class="note">Password reset is available to admins and Technical Support within this organization only. It sends a one-time link and never shows a password. All invitation and reset actions are recorded in the audit trail.</p>`}
function tpl(){const T=[['Appointment reminder','Email · SMS'],['Installment due soon','Email · SMS'],['Installment overdue','Email'],['Staff invitation','Email'],['Password reset','Email']];
